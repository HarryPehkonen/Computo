# Computo's gate. The policy is this file; the engine is kit-ci, installed once per
# machine (build KitCI, then: cmake --install build --prefix ~/.local).
#
# One definition, three callers - by hand (scripts/gate.sh), git on commit and on push
# (.githooks/, which names the tier), and a nightly clean checkout (the same
# scripts/gate.sh in a fresh clone). Changing the gate means editing this file:
# `kit-ci --list` and `kit-ci --graph` read the same parse the run uses.
#
# Until 2026-10-06 the gate WAS one file: a 1054-line tools/ci.sh. Every stage it ran is
# declared here, in the order it ran them, and the work of a stage that needs more than
# one command lives in a script next to this file. What could not be expressed in this
# vocabulary, and how each case was resolved, is in INCIDENTS.md and in the notes below.

[gate]
repo = "computo"

# pre-commit: seconds, not minutes (the old CI_FAST_STAGES, plus `docs` — see below).
#
# The order written here IS the run order (`resolved_stages()` in the engine: a tier runs the
# stages in the order the list gives them, then any stage declaring `tier = "<name>"`).
#
# `docs` joined on 2026-10-16 (card t_79c842b6). It grades the binary the `build` stage has just
# produced — therefore after it, never before — and it costs about 1.0 s on a warm tree
# (measured on this machine with the build present: the stage runs the 66 documented examples,
# the README examples, the coverage check and two byte-comparisons against regenerated output).
# That is inside the seconds budget, and it is what makes documentation drift a commit-time
# failure on this machine instead of a runner's verdict after the push:
# .github/workflows/docs.yml, which used to be the only place these checks ran, is deleted.
# If the stage ever grows past a few seconds on a cold tree, the measurement above is the reason
# it was moved here, and a new measurement is the reason to move it back to [tier.full].
#
# gate.toml is the ONLY home of this list. The CI_FAST_STAGES / CI_FULL_STAGES variables in
# scripts/gate-env.sh are vestigial since the gate became this file: they are still defined
# (nothing was removed) and nothing reads them for a run — kit-ci parses this file.
[tier.fast]
stages = ["format", "build", "tests", "docs"]

# pre-push: every stage. The old hook passed `--require-clean full`; kit-ci has no
# per-run flags, so the hook sets CI_REQUIRE_CLEAN=1 in the environment instead and
# scripts/tree.sh reads it - same rule, same caller.
[tier.full]
stages = ["*"]

# ---------------------------------------------------------------- the stages
# Declaration order IS the run order for tier.full, and it is the order the old
# CI_FULL_STAGES used:
#   tree format build tests docs release package version asan tsan tidy pristine
# (`kitprobes` sat in that list too; it did NOT survive the conversion - a probe checks
# a FILE, and the file it checked (tools/ci.sh) is gone. The closing note in this file
# says how each guarantee it stood for got its new home.)

[stage.tree]
cmd = "scripts/tree.sh"

[stage.format]
cmd = "scripts/format.sh"
when = "tool:clang-format"

[stage.build]
cmd = "scripts/build.sh"
timeout = 0     # a cold compile on a slow machine is not a failure

[stage.tests]
cmd = "scripts/tests.sh"

[stage.docs]
cmd = "scripts/docs.sh"

[stage.release]
cmd = "scripts/release.sh"
timeout = 0     # a cold compile on a slow machine is not a failure

[stage.package]
cmd = "scripts/package.sh"
timeout = 0     # a fresh configure+build for the packages is not a failure

[stage.version]
cmd = "scripts/version.sh"

[stage.asan]
cmd = "scripts/asan.sh"
timeout = 0     # a cold compile on a slow machine is not a failure

[stage.tsan]
cmd = "scripts/tsan.sh"
timeout = 0     # a cold compile on a slow machine is not a failure

[stage.tidy]
cmd = "scripts/tidy.sh"
timeout = 0     # a cold compile on a slow machine is not a failure
when = "tool:clang-tidy"

[stage.pristine]
cmd = "scripts/pristine.sh"
timeout = 0     # a cold compile on a slow machine is not a failure

# ---------------------------------------------------------------- what did not survive
# `kitprobes` - the stage that ran tools/kit-probes/*.sh, holding this copy to the
# AI-DEV-STARTER fixes it claimed to carry. Its subject was tools/ci.sh, which this
# conversion deletes, so the probes are deleted with it and every guarantee they stood
# for is recorded in INCIDENTS.md with the file that now carries it.
